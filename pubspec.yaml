name: snapnutri
description: AI-powered calorie tracker with Gemini integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # AI Integration
  google_generative_ai: ^0.4.3

  # Background Processing
  workmanager: ^0.5.2

  # Notifications
  flutter_local_notifications: ^17.1.2

  # Camera & Images
  camera: ^0.11.0+1
  image_picker: ^1.1.1
  image: ^4.2.0

  # Material You Theme
  dynamic_color: ^1.7.0

  # Charts & Analytics
  fl_chart: ^0.68.0

  # Storage
  shared_preferences: ^2.2.3

  # HTTP
  http: ^1.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  drift_dev: ^2.16.0
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  assets:
    - assets/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
